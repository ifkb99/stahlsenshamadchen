[workspace]
resolver = "3"
members = ["crates/tactics_core", "crates/game"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
tactics_core = { path = "crates/tactics_core" }
# `rc` so `Arc<HexMap>` and friends serialize; the sim shares several
# immutable structures behind an Arc to keep search-branching clones cheap.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"

# Fast compile times in dev; the sim core stays optimized for AI search.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
