[package]
name = "stahlsenshamädchen"
version.workspace = true
edition.workspace = true

[features]
# The Lua campaign-script host, parked 2026-09-23 (PARKED.md). Off by default;
# `cargo check -p stahlsenshamädchen --features lua-campaigns` keeps it honest.
lua-campaigns = ["dep:mlua"]

[dependencies]
tactics_core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
bevy = "0.19.0"
bevy_rand = "0.15.1"
rand_core = "0.10.1"
# Parked with the campaign-script host it serves (PARKED.md); off by default.
mlua = { version = "0.12.0", features = ["lua54", "vendored"], optional = true }
# Already in the tree via bevy; used to load vehicle sprites and recolour the
# team-key pixels before handing them to the renderer.
image = { version = "0.25", default-features = false, features = ["png"] }
