[package]
name = "stahlsenshamädchen"
version.workspace = true
edition.workspace = true

[dependencies]
tactics_core.workspace = true
serde.workspace = true
serde_json.workspace = true
bevy = "0.19.0"
bevy_rand = "0.15.1"
rand_core = "0.10.1"
mlua = { version = "0.12.0", features = ["lua54", "vendored"] }
# Already in the tree via bevy; used to load vehicle sprites and recolour the
# team-key pixels before handing them to the renderer.
image = { version = "0.25", default-features = false, features = ["png"] }
