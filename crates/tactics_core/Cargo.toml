[package]
name = "tactics_core"
version.workspace = true
edition.workspace = true

[dependencies]
hexx = { version = "0.24.0", features = ["serde"] }
rand = "0.10.2"
# `serde` so a saved game restores the exact rng stream position: a save
# that resumed with a fresh rng would replay differently from the run that
# produced it, which is the one property this engine is built around.
rand_chacha = { version = "0.10.0", features = ["serde"] }
# FxHash for the hex-keyed maps on the hot paths (`FastMap`); already in
# the lock through Bevy.
rustc-hash = "2.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[[bin]]
name = "validate-mods"
path = "src/bin/validate_mods.rs"

# The orders file's parsing is tested where it lives; examples are built but
# not tested by default, and an untested strictness check is a typo away
# from silently ignoring typos again.
[[example]]
name = "command"
test = true
